name: Ошибка
description: Сообщить о воспроизводимой проблеме
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Не публикуйте API-токены, персональные данные или исходные отчёты продавца."
  - type: textarea
    id: description
    attributes:
      label: Что произошло?
      description: Опишите ожидаемый и фактический результат.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Как воспроизвести?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия Node.js
      placeholder: "20.x"
  - type: checkboxes
    id: privacy
    attributes:
      label: Безопасность данных
      options:
        - label: Я удалил токены и персональные данные из примеров и логов.
          required: true
